<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10111a"><title>ลูกเทพศิลปศึกษา</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#10111a;--panel:#191a27;--line:#2d2e40;--muted:#a3a6bd;--accent:#b1a1ff;--ink:#f6f4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Noto Sans Thai',system-ui,sans-serif}header{border-bottom:1px solid var(--line);background:#151621}.wrap{width:min(1230px,94%);margin:auto}header .wrap,.row,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header .wrap{min-height:74px}.logo,.avatar{display:grid;place-items:center;flex:none;border-radius:12px;background:#2d2549;color:#cabfff;font-weight:700}.logo{width:42px;height:42px;font-size:21px}.brand{font-size:17px;font-weight:700}.muted,small{color:var(--muted)}header small{margin-left:auto}main{padding:36px 0 48px}h1,h2,p{margin:0}h1{font-size:clamp(26px,4vw,35px);letter-spacing:-.025em}h2{font-size:19px}.intro{justify-content:space-between;margin-bottom:24px}.intro p{margin-top:4px}.notice{background:#252139;border:1px solid #40365d;color:#ddd4ff;border-radius:12px;padding:12px 16px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.card{padding:15px 17px}.card strong{display:block;font-size:28px;line-height:1.5}.card:nth-child(2) strong{color:#ffc88c}.card:nth-child(3) strong{color:#f6aabd}.card:nth-child(4) strong{color:#9fe5c7}.toolbar{padding:16px 18px;justify-content:space-between}.filters{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;color:inherit;border:1px solid #414257;border-radius:8px;background:#222333;padding:8px 11px}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button.primary{background:#b4a5ff;color:#181328;border-color:transparent}.table{overflow:auto}table{width:100%;min-width:1040px;border-collapse:collapse;text-align:left}th,td{padding:12px;border-top:1px solid var(--line)}th:first-child,td:first-child{padding-left:18px}th{color:var(--muted);background:#1e1f2e;font-size:12px;white-space:nowrap}td{font-variant-numeric:tabular-nums}td small{display:block}.avatar{width:33px;height:33px;border-radius:10px}.person{display:flex;align-items:center;gap:9px;white-space:nowrap}.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;background:#233b37;color:#a6eed1;white-space:nowrap}.pill.watch{background:#413427;color:#ffcf97}.pill.active{background:#402b39;color:#ffc1d3}.pill.done{background:#30294a;color:#d5c9ff}.foot{padding:14px 18px;border-top:1px solid var(--line)}dialog{width:min(660px,94vw);max-height:90dvh;background:var(--panel);color:var(--ink);border:1px solid #45445c;border-radius:16px;padding:20px}dialog::backdrop{background:#090912bd}.between{justify-content:space-between}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}label{display:grid;gap:5px;color:#d5d4e7}label input,label select,label textarea{width:100%;min-width:0}.wide{grid-column:1/-1}.history{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.history p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.error{color:#ffc1d3}.overdue{color:#ffc1d3}#toast{position:fixed;bottom:20px;right:20px;background:#30294a;color:white;padding:12px 18px;border-radius:10px;z-index:1}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}main{padding-top:24px}.toolbar{align-items:flex-start}.filters input{width:100%}header small{margin-left:0}.fields{gap:8px}}
</style></head><body>
<header><div class="wrap"><div class="logo" aria-hidden="true">ศ</div><div><div class="brand">ลูกเทพศิลปศึกษา</div><div class="muted">สาขาศิลปศึกษา มหาวิทยาลัยราชภัฏเชียงใหม่</div></div><small>ข้อมูลบันทึกในเบราว์เซอร์นี้</small></div></header>
<main class="wrap"><div class="row intro"><div><h1>ภาพรวมการติดตามนักศึกษา</h1><p class="muted">นักศึกษา · ประวัติการศึกษา · การเข้าเรียน · นัดหมายติดตาม</p></div><div class="row"><button id="export">ดาวน์โหลด CSV</button><button id="add" class="primary">＋ เพิ่มนักศึกษา</button></div></div>
<div class="notice" id="alert"></div><section class="stats" aria-label="สรุปการติดตาม" id="stats"></section>
<section class="panel"><div class="toolbar"><h2>รายชื่อนักศึกษา</h2><div class="filters"><input id="search" type="search" placeholder="ค้นหาชื่อ รหัส หรือโรงเรียน" aria-label="ค้นหาชื่อ รหัส หรือโรงเรียน"><select id="filter" aria-label="กรองสถานะ"><option value="">ทุกสถานะ</option></select></div></div>
<div class="table"><table><thead><tr><th>นักศึกษา</th><th>โรงเรียนที่จบมา</th><th>เกรดเฉลี่ยเดิม</th><th>เข้าเรียน</th><th>ขาดเรียน</th><th>งานค้าง</th><th>สถานะติดตาม</th><th>นัดครั้งถัดไป</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div><div id="count" class="foot muted"></div></section></main>
<dialog id="editor"><div class="row between"><h2 id="dialogTitle"></h2><button id="close" aria-label="ปิด" type="button">✕</button></div><form id="form"><div class="fields">
<label>รหัสนักศึกษา<input name="id" required maxlength="30"></label><label>ชื่อ–นามสกุล<input name="name" required maxlength="120"></label>
<label>โรงเรียนที่จบมา<input name="school" maxlength="150"></label><label>เกรดเฉลี่ยเดิม<input name="gpa" type="number" min="0" max="4" step="0.01"></label>
<label>ช่องทางติดต่อ<input name="contact" maxlength="150"></label><label>ผู้รับผิดชอบติดตาม<input name="advisor" maxlength="120"></label>
<label>เข้าเรียน (%)<input name="attendance" type="number" min="0" max="100"></label><label>ขาดเรียน (ครั้ง)<input name="absence" type="number" min="0"></label>
<label>งานค้าง (ชิ้น)<input name="missing" type="number" min="0"></label><label>สถานะติดตาม<select name="status"></select></label>
<label>นัดติดตามครั้งถัดไป<input name="due" type="date"></label><label>ประเด็นที่ติดตาม<input name="issue" maxlength="200"></label>
<label class="wide">เพิ่มบันทึกการติดตาม<textarea name="note" rows="3" maxlength="2000" placeholder="การติดต่อ ผลการพูดคุย หรือสิ่งที่ต้องทำต่อ"></textarea></label></div>
<p id="error" class="error" role="alert"></p><div class="row between"><button id="remove" type="button">ลบข้อมูล</button><button class="primary" type="submit">บันทึกข้อมูล</button></div></form><section class="history" id="history"></section></dialog>
<div id="toast" role="status" hidden></div>
<script>
const $ = id => document.getElementById(id);
const statuses = {normal:'ปกติ',watch:'เฝ้าระวัง',active:'กำลังติดตาม',done:'ติดตามแล้ว'};
const today = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(new Date());
const date = value => value ? new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeZone:'Asia/Bangkok'}).format(new Date(value)) : '—';
const key = 'lukthep-student-records-v1';
const examples = [
 ['ตัวอย่าง 01','กานต์ ธาราศิลป์','โรงเรียนศิลป์ศึกษา','3.45',95,0,0,'normal'],
 ['ตัวอย่าง 02','พิมพ์ชนก แสงดาว','โรงเรียนเมืองวิทยา','2.78',67,2,2,'active'],
 ['ตัวอย่าง 03','ธนกฤต วาดฝัน','โรงเรียนเทศบาลวิทยา','3.12',76,1,1,'watch'],
 ['ตัวอย่าง 04','ศิรินภา พูนศิลป์','โรงเรียนศิลป์ศึกษา','3.80',100,0,0,'normal'],
 ['ตัวอย่าง 05','ภาคิน จันทร์ทอง','โรงเรียนชุมชนศึกษา','3.28',90,1,0,'done'],
 ['ตัวอย่าง 06','ณัฐธิดา มีแสง','โรงเรียนเมืองวิทยา','2.96',75,2,1,'watch']
].map(([id,name,school,gpa,attendance,absence,missing,status])=>({id,name,school,gpa,attendance,absence,missing,status,due:status==='active'?today():'',issue:status==='active'?'เข้าเรียนต่ำกว่า 80% และมีงานค้าง':'',contact:'',advisor:'',notes:[],demo:true}));
let records;
try { records = JSON.parse(localStorage.getItem(key)) ?? examples; } catch { records=examples; }
let editing=null;
let timer;
const form=$('form');
for(const [value,label] of Object.entries(statuses)){
 $('filter').add(new Option(label,value));
 form.elements.status.add(new Option(label,value));
}
function node(tag,value,cls){
 const element=document.createElement(tag);
 if(value!==undefined) element.textContent=value;
 if(cls) element.className=cls;
 return element;
}
function visible(){
 const query=$('search').value.trim().toLocaleLowerCase('th');
 const status=$('filter').value;
 return records.filter(record=>(!status||record.status===status)&&[record.id,record.name,record.school].some(value=>value.toLocaleLowerCase('th').includes(query)));
}
function due(record){return record.due&&record.due<=today()&&['watch','active'].includes(record.status);}
function render(){
 const shown=visible();
 const attendance=records.filter(record=>record.attendance!==''&&record.attendance!=null);
 const average=attendance.length?Math.round(attendance.reduce((sum,record)=>sum+Number(record.attendance),0)/attendance.length)+'%':'—';
 const upcoming=records.filter(due).length;
 $('alert').textContent=(records.some(record=>record.demo)?'มีข้อมูลตัวอย่าง · ':'')+(upcoming?'ถึงกำหนดติดตาม '+upcoming+' คน':'ไม่มีนัดติดตามที่ถึงกำหนด');
 $('stats').replaceChildren(...[
 ['นักศึกษาทั้งหมด',records.length],['เฝ้าระวัง',records.filter(r=>r.status==='watch').length],['กำลังติดตาม',records.filter(r=>r.status==='active').length],['เข้าเรียนเฉลี่ย',average]
 ].map(([label,value])=>{const card=node('div',undefined,'card');card.append(node('div',label,'muted'),node('strong',value));return card;}));
 $('rows').replaceChildren(...shown.map(record=>{
 const tr=node('tr');
 const td=node('td'), person=node('div',undefined,'person'), details=node('div');
 details.append(node('strong',record.name),node('small',record.id));
 person.append(node('span',record.name.slice(0,1),'avatar'),details);
 td.append(person);
 tr.append(td);
 for(const value of [record.school,record.gpa===''?'':Number(record.gpa).toFixed(2),record.attendance===''?'':record.attendance+'%',record.absence,record.missing])tr.append(node('td',value===''||value==null?'—':value));
 const status=node('td');
 status.append(node('span',statuses[record.status],'pill '+record.status));
 if(record.issue)status.append(node('small',record.issue));
 const action=node('td'),button=node('button','เปิดประวัติ');
 button.addEventListener('click',()=>open(record));
 action.append(button);
 tr.append(status,node('td',date(record.due),due(record)?'overdue':''),action);
 return tr;
 }));
 if(!shown.length){const row=node('tr'),cell=node('td','ไม่พบข้อมูลนักศึกษา','muted');cell.colSpan=9;row.append(cell);$('rows').append(row);}
 $('count').textContent='แสดง '+shown.length+' จาก '+records.length+' คน';
}
function open(record){
 editing=record??null;
 form.reset();
 $('error').textContent='';
 $('dialogTitle').textContent=record?'ประวัตินักศึกษา':'เพิ่มนักศึกษา';
 $('remove').hidden=!record;
 for(const field of form.elements)if(field.name&&field.name!=='note'&&record)field.value=record[field.name]??'';
 const list=$('history');
 list.replaceChildren(node('h2','ประวัติการติดตาม'));
 if(!record?.notes.length)list.append(node('p','ยังไม่มีบันทึก','muted'));
 for(const entry of [...(record?.notes??[])].reverse())list.append(node('small',date(entry.at)),node('p',entry.text));
 $('editor').showModal();
}
function save(next,message){
 try {localStorage.setItem(key,JSON.stringify(next));}catch{$('error').textContent='บันทึกไม่สำเร็จ โปรดตรวจสอบพื้นที่จัดเก็บของเบราว์เซอร์';return;}
 records=next;$('editor').close();render();
 $('toast').textContent=message;$('toast').hidden=false;
 clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600);
}
form.addEventListener('submit',event=>{
 event.preventDefault();
 const values=Object.fromEntries([...new FormData(form)].map(([field,value])=>[field,value.trim()]));
 if(!values.id||!values.name){$('error').textContent='กรุณาระบุรหัสและชื่อนักศึกษา';return;}
 if(records.some(record=>record!==editing&&record.id===values.id)){$('error').textContent='รหัสนักศึกษานี้มีอยู่แล้ว';return;}
 const {note,...fields}=values;
 const notes=[...(editing?.notes??[])];
 if(note)notes.push({at:new Date().toISOString(),text:note});
 const next={...fields,notes,demo:editing?.demo??false};
 save(editing?records.map(record=>record===editing?next:record):[...records,next],'บันทึกข้อมูลแล้ว');
});
$('remove').onclick=()=>{if(editing&&confirm('ลบข้อมูลและประวัติของ '+editing.name+'?'))save(records.filter(record=>record!==editing),'ลบข้อมูลแล้ว');};
$('add').onclick=()=>open();
$('close').onclick=()=>$('editor').close();
$('search').oninput=render;
$('filter').onchange=render;
$('export').onclick=()=>{
 const fields={id:'รหัสนักศึกษา',name:'ชื่อ–นามสกุล',school:'โรงเรียนที่จบมา',gpa:'เกรดเฉลี่ยเดิม',attendance:'เข้าเรียน (%)',absence:'ขาดเรียน',missing:'งานค้าง',status:'สถานะติดตาม',due:'นัดติดตามครั้งถัดไป',contact:'ช่องทางติดต่อ',advisor:'ผู้รับผิดชอบ',issue:'ประเด็นติดตาม'};
 const quote=value=>{const string=String(value??'');return '"'+(/^[=+@\-\r\n\t]/.test(string)?"'":'')+string.replaceAll('"','""')+'"';};
 const lines=[Object.values(fields),...visible().map(record=>Object.keys(fields).map(field=>field==='status'?statuses[record.status]:record[field]))];
 const url=URL.createObjectURL(new Blob(['\uFEFF',lines.map(row=>row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 const link=node('a');link.href=url;link.download='ลูกเทพศิลปศึกษา.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
render();
</script></body></html>
